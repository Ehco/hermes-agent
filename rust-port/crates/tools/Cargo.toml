[package]
name = "hermes-tools"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
hermes-core = { path = "../core" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["time", "net", "rt"] }
anyhow = { workspace = true }
regex = "1"
# `blocking` drives the sync `execute()` entry points off the registry's
# spawn_blocking path without needing async plumbing through every tool.
reqwest = { workspace = true, features = ["blocking"] }
# Wrappers: the memory tool wraps the skills crate's MemoryStore and the
# skills tools wrap its skill catalog; cronjob_manage wraps the schedulers'
# JobStore (no reimplementation of either).
hermes-skills = { path = "../skills" }
hermes-schedulers = { path = "../schedulers" }
# Kanban tools: inline base64 attachment decoding.
base64 = "0.22"
rusqlite = { version = "0.41.0", features = ["bundled"] }

[dev-dependencies]
# Board-state round-trip tests run in an isolated HERMES_HOME tempdir.
tempfile = "3"
