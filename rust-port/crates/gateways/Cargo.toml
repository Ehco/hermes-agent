[package]
name = "hermes-gateways"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
hermes-core = { path = "../core" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util", "time", "sync"] }
anyhow = { workspace = true }
reqwest = { workspace = true, features = ["multipart"] }
regex = "1"
# Discord wss: rustls (ring provider — the one reqwest's rustls-tls already
# compiles on windows-gnu) + tokio-rustls + webpki-roots (static trust store,
# no OS cert APIs).
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "tls12", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
webpki-roots = "1.0"
