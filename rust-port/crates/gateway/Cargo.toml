[package]
name = "hermes-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
hermes-core = { path = "../core" }
hermes-tools = { path = "../tools" }
hermes-session = { path = "../session" }
hermes-skills = { path = "../skills" }
hermes-mcp = { path = "../mcp" }
serde = { workspace = true }
serde_json = { workspace = true }
rusqlite = { version = "0.41.0", features = ["bundled"] }
tokio = { workspace = true, features = ["net", "sync", "time", "macros", "rt-multi-thread", "process"] }
anyhow = { workspace = true }
futures = { workspace = true }
axum = { version = "0.8", features = ["ws"] }
tokio-stream = "0.1"

[dev-dependencies]
reqwest = { workspace = true }
tower = { version = "0.5", features = ["util"] }
tokio-tungstenite = "0.24"
