[workspace]
resolver = "2"
members = ["crates/core", "crates/tools", "crates/session", "crates/cli", "crates/tui", "crates/gateway", "crates/skills", "crates/schedulers", "crates/gateways", "crates/mcp"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "fs", "process"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
thiserror = "2"
anyhow = "1"
futures = "0.3"

[profile.release]
lto = "thin"
